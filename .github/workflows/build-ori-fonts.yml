name: Build Ori Fonts

on:
  push:
    branches: [main]
    paths:
      - "tools/fonts/**"
      - ".github/workflows/build-ori-fonts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fonts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Ori
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install font tooling
        run: python -m pip install --upgrade fonttools brotli

      - name: Download pinned Inter source
        run: |
          mkdir -p tools/fonts/source
          curl -L --fail --retry 3 "https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip" -o /tmp/inter.zip
          unzip -q /tmp/inter.zip -d /tmp/inter
          cp "$(find /tmp/inter -type f -name 'Inter-Regular.otf' | head -n 1)" tools/fonts/source/Inter-Regular.otf
          cp "$(find /tmp/inter -type f -name 'InterDisplay-Regular.otf' | head -n 1)" tools/fonts/source/InterDisplay-Regular.otf

      - name: Build Ori font families
        run: python tools/fonts/build_ori_fonts.py

      - name: Commit generated fonts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/fonts/Ori*-Regular.woff2
          if git diff --cached --quiet; then
            echo "Fonts already up to date."
            exit 0
          fi
          git commit -m "Build Ori starter font families"
          git push
